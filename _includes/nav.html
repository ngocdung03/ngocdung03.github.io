<nav class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <ul class="nav-links">
      {% for item in site.nav %}
      {% assign target = item.url | relative_url %}
      <li><a href="{{ target }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </div>
</nav>
