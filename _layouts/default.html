<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}">
  <script>
    // Applied before first paint so a stored choice never flashes the wrong theme.
    // No stored choice means no attribute, and the CSS falls back to prefers-color-scheme.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
</head>
<body>
  {% include nav.html %}
  <main class="wrap">
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById('theme-toggle');
      if (!button) return;
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)');

      function current() {
        return root.getAttribute('data-theme') || (systemDark.matches ? 'dark' : 'light');
      }
      function label() {
        button.setAttribute('aria-label',
          current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      }

      button.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        label();
      });

      // Track the system setting only while the reader has not chosen for themselves.
      systemDark.addEventListener('change', function () {
        if (!root.hasAttribute('data-theme')) label();
      });

      label();
    })();
  </script>
</body>
</html>
